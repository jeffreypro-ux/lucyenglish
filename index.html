<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucy 的英语复习站</title>
<style>
/* ================= 基础 ================= */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#FFF9F2; --card:#FFFFFF; --ink:#33302B; --muted:#9A9186;
  --accent:#FF6B4A; --accent-soft:#FFE9E2;
  --green:#2E9E6B; --green-soft:#E3F4EC;
  --blue:#3E6FB0; --blue-soft:#E7EEF8;
  --line:#F2E8DA; --radius:16px; --shadow:0 2px 10px rgba(51,48,43,.05);
}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.8;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:820px;margin:0 auto;padding:0 18px;}
.en{font-family:Georgia,"Times New Roman",serif;}

/* ================= 顶部 ================= */
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;}
header.top .wrap{height:58px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:17px;font-weight:800;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px;}
.logo::before{content:"📖";font-size:18px;}
nav.tabs{display:flex;gap:6px;}
nav.tabs a{text-decoration:none;color:var(--muted);font-size:14px;padding:6px 14px;border-radius:999px;}
nav.tabs a.on,nav.tabs a:hover{background:var(--accent-soft);color:var(--accent);}

/* ================= 声音设置 ================= */
.voice-panel{
  background:linear-gradient(135deg,#FFF1E8,#FFE7DC);border:1px solid #FFD9C8;border-radius:var(--radius);
  padding:14px 18px;margin:18px 0 0;
}
.voice-panel summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px;}
.voice-panel summary::before{content:"🔊";}
.voice-panel summary::-webkit-details-marker{display:none;}
.voice-panel .row{margin-top:10px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.voice-panel select{font-size:13px;padding:6px 10px;border-radius:10px;border:1px solid #F0C9B6;background:#fff;max-width:100%;}
.voice-panel input[type=range]{width:160px;accent-color:var(--accent);}
.voice-panel .tip{font-size:12px;color:var(--muted);margin-top:6px;}

/* ================= 首页 ================= */
.hero{padding:44px 0 10px;text-align:center;}
.hero .hello{font-size:14px;color:var(--accent);font-weight:700;letter-spacing:2px;}
.hero h1{font-size:30px;margin:6px 0 8px;}
.hero p{color:var(--muted);font-size:14px;}
.hero .chips{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
.hero .chip{
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:6px 18px;font-size:13px;color:var(--muted);box-shadow:var(--shadow);
}
.hero .chip b{color:var(--accent);}

.lesson-grid{padding:16px 0 40px;}
a.lesson-card{
  display:block;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);
  transition:transform .15s,box-shadow .15s;
}
a.lesson-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(51,48,43,.09);}
.lesson-card .top-row{display:flex;justify-content:space-between;align-items:center;}
.lesson-card .no{
  font-size:12px;font-weight:800;color:var(--accent);background:var(--accent-soft);
  border-radius:999px;padding:2px 12px;
}
.lesson-card .date{font-size:12px;color:var(--muted);}
.lesson-card h2{font-size:17px;margin:8px 0 4px;}
.lesson-card .sub{font-size:13px;color:var(--muted);}
.lesson-card .tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
.lesson-card .tag{font-size:11px;color:var(--green);background:var(--green-soft);border-radius:999px;padding:1px 9px;}
.lesson-card.soon{opacity:.55;}

/* ================= 课时页 ================= */
.lesson-head{padding:30px 0 4px;}
.lesson-head .crumb{font-size:13px;color:var(--muted);margin-bottom:8px;}
.lesson-head .crumb a{color:var(--accent);text-decoration:none;}
.lesson-head h1{font-size:24px;}
.lesson-head .meta{color:var(--muted);font-size:13px;margin-top:4px;}
.lesson-head .tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;}
.lesson-head .tag{font-size:11px;color:var(--green);background:var(--green-soft);border-radius:999px;padding:1px 9px;}

section.sec{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-top:16px;box-shadow:var(--shadow);
}
section.sec>h2{
  font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
section.sec>h2::before{
  content:"";width:5px;height:16px;border-radius:3px;background:var(--accent);flex:none;
}
section.sec ul{margin-left:20px;font-size:14.5px;}
section.sec li{margin:6px 0;}
section.sec p{font-size:14.5px;margin:6px 0;}

.speak{
  border:none;background:var(--accent-soft);color:var(--accent);cursor:pointer;
  border-radius:999px;width:26px;height:26px;font-size:13px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;margin-left:6px;vertical-align:middle;
}
.speak:hover{background:var(--accent);color:#fff;}

.ok{color:var(--green);font-weight:700;}
.no{color:#C25B4A;text-decoration:line-through;text-decoration-color:rgba(194,91,74,.4);}
.why{font-size:13px;color:var(--muted);}
.b{font-weight:700;color:var(--accent);}
.bbox{
  background:var(--blue-soft);border-radius:12px;padding:12px 16px;font-size:14.5px;
  margin:8px 0;overflow-x:auto;
}
.dialog .line{display:flex;gap:10px;margin:9px 0;font-size:14.5px;align-items:flex-start;}
.dialog .who{
  flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:2px 11px;margin-top:3px;
}
.dialog .lucy .who{background:var(--accent-soft);color:var(--accent);}
.dialog .mike .who{background:var(--blue-soft);color:var(--blue);}
.dialog .msg{flex:1;}
.hw{background:var(--green-soft);border-radius:12px;padding:12px 16px;font-size:14.5px;}

.pager{display:flex;justify-content:space-between;gap:10px;margin:26px 0 40px;flex-wrap:wrap;}
.pager a{
  flex:1;min-width:130px;text-align:center;text-decoration:none;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;
}
.pager a:hover{border-color:var(--accent);color:var(--accent);}
.pager a small{display:block;color:var(--muted);font-size:11px;}

/* ================= 单词页 ================= */
.word-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:12px;padding:16px 0 40px;
}
.word-card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;
  transition:transform .15s;
}
.word-card:hover{transform:translateY(-2px);}
.word-card .w{font-size:17px;font-weight:800;color:var(--accent);display:flex;align-items:center;}
.word-card .p{font-size:12px;color:var(--muted);font-family:Georgia,serif;}
.word-card .m{font-size:13.5px;margin-top:4px;}
.word-card .e{font-size:13px;color:var(--blue);margin-top:4px;font-family:Georgia,serif;}

footer{padding:22px 0;text-align:center;color:var(--muted);font-size:12px;}

@media (max-width:560px){
  .hero h1{font-size:25px;}
  .lesson-head h1{font-size:21px;}
}
</style>
<base target="_blank">

<header class="top">
  <div class="wrap">

      <a href="#/words" data-nav="words">单词本</a>
    </nav>

</header>

<div class="wrap">

<script>
/* ================================================================
   课程内容数据区（老师只需要改这里）
   新增一节课：复制 LESSONS 里的模板，粘贴到数组最前面，改内容。
   想加真人录音：在课程对象里加 audio:"audio/xxx.mp3"
   单词：在 WORDS 数组最前面加一行。
================================================================ */

const LESSONS = [

  {
    id: 8,
    date: "2026-10-28",
    title: "第八课：主题演讲——我最好的朋友",
    subtitle: "Mike 老师 · 半英半中抠细节 · 友谊话题 · 过渡句与上价值",
    tags: ["已更新", "演讲", "友谊话题", "定语从句", "过渡句"],
    sections: [
      { h:"一、热身闲聊：又是加班的一天", type:"list", items:["最近天天加班：<span class='en'>I got overtime day by day.</span>（day by day = 每一天都这样）","刚刚到家：<span class='en'>I just got back home.</span>","表达情绪可以更口语化：<span class='en'>I'm so busy!</span> 语气加重、加情绪词，比平铺直叙更地道。","本课模式：<span class='b'>半英半中抠细节</span>——一节课全英、一节课半英半中交替，慢慢建立英语思维。"] },
      { h:"二、话题：Who is your best friend?", type:"list", items:["Lucy 的素材：最好的朋友是<span class='b'>高中同学</span>，上周刚一起吃了火锅、在家打了麻将。","从高中到工作一直互相陪伴：<span class='en'>from high school to work</span>","大学在同一城市，现在又在同一城市工作：<span class='en'>We studied in the same city for university, and now we also work in the same city.</span>","注意：<span class='no'>✗ in a same city</span> → <span class='ok'>✓ in the same city</span> <span class='why'>same 前面要加 the。</span>"] },
      { h:"三、核心词汇：性格描述", type:"list", items:["性格 <span class='b'>personality</span>（person 个人 + al 形容词 → 再加 ty 变名词）","互补：口语说 <span class='en'>our personalities match well</span>（match 匹配 + well 程度）；书面语 complement","细腻 <span class='b'>delicate</span>：<span class='en'>She has a delicate personality.</span>","考虑周全 <span class='en'>thinks things through</span>（through = 看透、想透）","直白 <span class='b'>straightforward</span>（一个词，straight 直 + forward 向前）","相处舒服：<span class='en'>We feel really comfortable staying with each other.</span> <span class='why'>两个动词连用，第二个加 ing：feel comfortable + staying。</span>"] },
      { h:"四、语法点：主系表 vs 主谓宾", type:"list", items:["判断方法：是在<strong>形容</strong>主语，还是主语发生了<strong>动作</strong>？","「我是比较直白的」是形容 → 主系表 → 要加 be 动词：<span class='no'>✗ I pretty straightforward</span> → <span class='ok'>✓ I am pretty straightforward.</span>","转折用 <span class='b'>while</span>（然而）：<span class='en'>She has a delicate personality and thinks things through, while I am pretty straightforward.</span>","中英文切换时先判断句型，动词才不会用错。"] },
      { h:"五、上价值：讲一个具体的故事", type:"list", items:["Mike 提醒：前面性格描述比较笼统，演讲要<span class='b'>加一件具体的小事</span>。","Lucy 的故事：一次高中考试成绩不理想 → 哭了 → 觉得自己笨、学不会 → 朋友开导、鼓励、帮她讲功课。","翻译精讲：","我记得有一次 → <span class='en'>I remember once.</span>（比 one time 更简洁）","成绩不理想 → <span class='en'>I got a bad grade in a high school exam.</span>（英语先说重点；grade 成绩）","fail 是不及格，程度太重，不理想用 <span class='b'>bad grade</span> 更准","我哭了，觉得自己很笨、学不会 → <span class='en'>I cried and I thought I was stupid and couldn't learn it.</span> <span class='why'>过去的事：thought / was / couldn't。</span>","开导 → <span class='b'>comfort</span>（形容词 comfortable 去掉 able 变动词，使人舒服）","鼓励 → <span class='b'>encourage</span>（inspire 激励语气更狠，encourage 更温柔）","帮我讲功课 → <span class='en'>helped me with my lessons</span>（help sb. with sth.）","程度副词别丢：<span class='en'>encouraged me a lot</span>"] },
      { h:"六、过渡与收尾技巧", type:"list", items:["万能转折词 <span class='b'>anyway</span>（总之、反正）：讲完分歧后自然引回主题——<span class='en'>Anyway, she is my best friend.</span>","求助/感谢表达：<span class='en'>She gave me a hand when I needed help.</span>（give me a hand 帮我一把）","结尾许愿：<span class='en'>If possible, I hope we can be best friends forever.</span>（if possible 如果可能的话）","单字反驳技巧：表达强烈立场时直接说一个词——<span class='en'>Impossible!</span> 根本不可能！","有分歧：<span class='en'>We also have different opinions.</span>（opinion 意见）"] },
      { h:"七、八卦实战：朋友的恋爱分歧（定语从句复习）", type:"list", items:["例如 for example：<span class='en'>Her boyfriend is a South person.</span>（南方人；north 北 / south 南 / east 东 / west 西）","复杂版（定语从句）：<span class='en'>The boyfriend who she has a relationship with is a South person.</span>（relationship 关系）","想太多：<span class='b'>overthinking</span>（over + thinking）→ <span class='en'>She keeps overthinking about it.</span>（keep + doing 一直做）","担心南北文化差异：<span class='en'>She worries about the culture difference between South and North.</span> <span class='why'>difference 名词差异；different 是形容词。</span>","Lucy 的观点：<span class='en'>I think it doesn't matter if they love each other.</span>（只要相爱就没问题）","Mike 点评：用英语聊八卦特别好——<span class='why'>八卦是最好的语言素材，人人都爱讲。</span>"] },
      { h:"八、演讲完整版（跟读材料）", type:"list", items:["<div class='bbox en'>My best friend is my high school classmate. We studied in the same city for university, and now we also work in the same city. I think our personalities match well — she has a delicate personality and thinks things through, while I am pretty straightforward, so we feel really comfortable staying with each other.<br><br>But we also have different opinions. For example, her boyfriend is a South person, and she keeps overthinking about the culture difference between South and North. But I think it doesn't matter if they love each other.<br><br>Anyway, she is my best friend. She gave me a hand when I needed help. I remember once I got a bad grade in a high school exam — I cried and thought I was stupid and couldn't learn it. She comforted me and encouraged me a lot, and helped me with my lessons. If possible, I hope we can be best friends forever.</div>","<span class='why'>📌 练习方法：先逐段抠熟 → 只看中文说 → 脱稿自由发挥。不要 100% 复述，加入自己想说的内容。</span>"] },
      { h:"九、口语技巧小结", type:"list", items:["<b>卡壳就重来</b>：口语练习不怕错，重说一遍即可","<b>语调口语化</b>：假装在说话而不是在读稿","<b>内容做加法</b>：基础版完成后，延伸 1-2 件别的事（工作、分歧、小故事）","<b>自然过渡</b>：anyway / but / for example / I remember once","<b>下节课预告</b>：全英模式，减少老师干涉，自己组织语言"] },
      { h:"作业", type:"homework", text:"1. 把「我最好的朋友」演讲练到脱稿：先抠细节逐句过，再自由发挥加入自己的内容\n2. 用性格词汇描述一位你身边的朋友：personality / delicate / straightforward / match well\n3. 练 3 个过渡句：Anyway… / For example… / I remember once…\n4. 预习全英模式：试着不看任何提示讲 1 分钟你的朋友" },
    ],
  },
  {
    id: 6,
    date: "2026-10-21",
    title: "第六课：状语从句 + 脱稿演讲实战",
    subtitle: "When / Because / If / Although 让句子更有深度",
    tags: ["已更新", "状语从句", "AI话题", "脱稿演讲"],
    sections: [
      { h:"课程概览", type:"list", items:["<b>热身</b>：Lucy 分享上周用英语给外国舞者检票的经历","<b>复习</b>：描述假期（扬州）和家乡（邢台）脱稿练习","<b>新语法</b>：状语从句 when / because / if / although","<b>演讲实战</b>：AI会取代我的工作吗？","<b>作业</b>：用状语从句描述家乡 + 每天5词造句"] },
      { h:"热身：上周英语实战", type:"dialog", lines:[["Lucy","Last weekend I used English to communicate with dancers from all over the world."],["Lucy","I was checking tickets and doing on-site registration."],["Lucy","I collected personal information: passport, real name, and nation."],["Lucy","I feel I have the courage to open my mouth and speak English now."]] },
      { h:"状语从句：四大连接词", type:"list", items:["<b>When</b> 当……时 → <span class='en'>When I hear this song, I immediately think of my childhood.</span>","<b>Because</b> 因为 → <span class='en'>I choose you because you are good to me.</span>","<b>If</b> 如果 → <span class='en'>If you haven't forgot everything I've done for you, I believe you'd still wait for me.</span>","<b>Although</b> 虽然 → <span class='en'>Although life is tough, let's work hard together. I believe things will get better.</span>"] },
      { h:"状语从句：翻译练习", type:"list", items:["<b>当我听起这首歌的时候，我立马想到了我的童年。</b><br><span class='en'>When I hear this song, I immediately think of my childhood.</span>","<b>我选择你，是因为你对我好。</b><br><span class='en'>I choose you because you are good to me.</span>","<b>如果你没有忘记我对你做的一切，我相信你还会等我的。</b><br><span class='en'>If you haven't forgot everything I've done for you, I believe you'd still wait for me.</span>","<b>虽然生活很苦，但我们一起努力，我相信生活会更好的。</b><br><span class='en'>Although life is tough, let's work hard together. I believe things will get better.</span>"] },
      { h:"演讲实战：AI会取代我的工作吗？", type:"list", items:["<b>开头（问句）</b>：<span class='en'>Will AI take all of my job?</span>","<b>观点1（Because）</b>：<span class='en'>I can use AI to reduce my work time and improve my work efficiency.</span>","<b>观点2（具体例子）</b>：<span class='en'>For example, AI can help me get market information and analyze data.</span>","<b>转折（Although）</b>：<span class='en'>Although AI can help me in many things, the things that need people to make subjective decisions — AI cannot copy.</span>","<b>结尾</b>：<span class='en'>I don't think AI will take all of my job.</span>"] },
      { h:"家乡描述 · 状语从句版", type:"list", items:["<b>When</b>：<span class='en'>When I went to university, I felt strange about my hometown.</span>","<b>Because</b>：<span class='en'>Because Beijing is a first-tier city, it has a fast pace.</span>","<b>If</b>：<span class='en'>If you stay in a big city, you can learn advanced information and skills.</span>","<b>Although</b>：<span class='en'>Although I have adapted to Beijing, I still miss the lively street vibe of my hometown.</span>","<b>So</b>：<span class='en'>So if you want to contribute to your hometown, stay in a big city first.</span>"] },
      { h:"新表达", type:"list", items:["<span class='en'>immediately</span> 立刻","<span class='en'>think of</span> 想到","<span class='en'>although</span> 虽然（不用再加but）","<span class='en'>tough</span> 艰难的","<span class='en'>work hard together</span> 一起努力","<span class='en'>precisely</span> 准确地","<span class='en'>reduce</span> 减少","<span class='en'>efficiency</span> 效率","<span class='en'>subjective / objective</span> 主观的 / 客观的","<span class='en'>make a decision</span> 做决策","<span class='en'>analyze data</span> 分析数据","<span class='en'>vivid</span> 生动的","<span class='en'>down to earth</span> 接地气的","<span class='en'>get used to</span> 习惯于","<span class='en'>street vibe</span> 街头氛围/烟火气","<span class='en'>miss</span> 想念","<span class='en'>adapt</span> 适应","<span class='en'>advanced</span> 先进的"] },
      { h:"演讲技巧", type:"list", items:["<b>做减法</b>：不要每个点都说，抓2-3个点讲透","<b>用连接词过渡</b>：honestly, actually, definitely, but, so","<b>从浅到深</b>：先讲事实 → 再讲感受 → 最后讲观点","<b>口语化表达</b>：多用 I think, I believe, I feel","<b>定语从句丰富表达</b>：<span class='en'>the things that need people...</span>","<b>演讲要有互动感</b>：用问句开头 <span class='en'>Will AI take my job?</span>"] },

    sections: [
      { h:"课程概览", type:"list", items:["<b>模式</b>：无PPT，纯英文对话综合测试","<b>场景1</b>：新人入职，向同事询问如何完成商业报告","<b>场景2</b>：公司周末团建，了解细节后决定是否参加","<b>场景3</b>：描述你的完美周末（Perfect Weekend）","<b>场景4</b>：谈谈你心中的成功生活（Successful Life）"] },
      { h:"场景1：新人入职 · 询问商业报告", type:"dialog", lines:[["Lucy","Hi Mike, can you do me a favor?"],["Lucy","I need to prepare a business report, but I don't have much experience about it. Can you help me?"],["Lucy","Honestly, I don't know what product I should choose to promote."],["Lucy","I need to ask my leader to check."],["Lucy","Where can I get the market data about the phone case?"],["Lucy","Do I have an account to log in the system?"],["Lucy","Can you share me some history data documents?"],["Lucy","Which website do you recommend to search for new information?"],["Lucy","What is the deadline for this report?"]] },
      { h:"场景1 · 关键表达", type:"list", items:["<b>求助</b>：<span class='en'>Can you do me a favor?</span> 你能帮我个忙吗？","<b>坦白不知道</b>：<span class='en'>Honestly, I don't know...</span> 说实话，我不知道...","<b>询问负责人</b>：<span class='en'>You need to ask your leader.</span> 你需要问负责人。","<b>登录系统</b>：<span class='en'>Do you have your own account to log in?</span> 你有账号登录吗？","<b>畅销品</b>：<span class='en'>best seller</span> 爆品/畅销品","<b>作为参考</b>：<span class='en'>for reference / follow them</span>","<b>调研竞品</b>：<span class='en'>Find out how the competitors sell.</span>","<b>截止时间</b>：<span class='en'>When is the deadline?</span>"] },
      { h:"场景2：周末团建 · 了解细节", type:"dialog", lines:[["Lucy","Hi Mike, I want to ask you some questions about the team building."],["Lucy","Honestly, I think weekend is my personal time. I don't want to go."],["Lucy","Where will we go?"],["Lucy","Will the company cover all expenses?"],["Lucy","If I don't have enough rest on weekend, I will feel tired on Monday."],["Lucy","What is the schedule?"],["Lucy","Oh really? Monday is also rest time? I must go!"],["Lucy","That sounds like a holiday trip with pay!"]] },
      { h:"场景2 · 关键表达", type:"list", items:["<b>私人时间</b>：<span class='en'>personal time</span>","<b>公司报销</b>：<span class='en'>Our company will cover all expenses.</span> 公司会支付所有费用。","<b>有顾虑</b>：<span class='en'>I have other doubts.</span>","<b>肯定去</b>：<span class='en'>I will definitely go. / I must go.</span>","<b>听起来不错</b>：<span class='en'>It sounds good.</span>","<b>带薪旅游</b>：<span class='en'>a holiday trip with pay</span>"] },
      { h:"场景3：描述完美周末", type:"list", items:["<b>开头</b>：<span class='en'>I think the perfect weekend is to fully take advantage of time.</span>","<b>第一天</b>：<span class='en'>First day, I will climb mountains with my friends. I can exercise and freely sweat it out.</span>","<b>晚上</b>：<span class='en'>At night, I will eat delicious food and have a relaxing shower.</span>","<b>第二天</b>：<span class='en'>The second day, I love to wake up naturally and play computer games all day.</span>","<b>在家派</b>：<span class='en'>I just want to stay at home and lie down to kill time.</span>","<b>感慨</b>：<span class='en'>I haven't had this perfect weekend for one year. I can't believe that!</span>（现在完成时）"] },
      { h:"场景3 · 重要词汇", type:"list", items:["<span class='en'>take advantage of</span> 充分利用","<span class='en'>sweat it out</span> 尽情出汗","<span class='en'>wake up naturally</span> 自然醒","<span class='en'>sleep in</span> 睡懒觉（更口语）","<span class='en'>lie down</span> 躺下 = 躺平","<span class='en'>kill time</span> 打发时间"] },
      { h:"场景4：谈谈成功的生活", type:"list", items:["<b>开头</b>：<span class='en'>I think a successful life needs two points.</span>","<b>条件1</b>：<span class='en'>First, I need my own house with the interior style I like.</span>","<b>景色</b>：<span class='en'>When I open the window, I can see the view I like.</span>","<b>条件2</b>：<span class='en'>Second, I want to work in my house. I don't need to go to company.</span>","<b>目标</b>：<span class='en'>So I need to earn one million to achieve it.</span>","<b>结尾</b>：<span class='en'>That's my successful life, I think.</span>"] },
      { h:"语法要点", type:"list", items:["<b>现在完成时</b>：表达从过去到现在的时间段 → <span class='en'>I haven't had this perfect weekend for one year.</span>","<b>定语从句</b>：描述喜欢的内容 → <span class='en'>the interior style I like / the view I like</span>","<b>When 引导时间</b>：打开窗户时 → <span class='en'>When I open the window, I can see...</span>","<b>简单疑问句</b>：口语中尽量用短句直接提问","<b>副词表达情绪</b>：honestly, definitely, really 让口语更自然"] },
      { h:"作业", type:"homework", text:"1. 每天复习本节课4个场景的对话，做到能脱稿复述\n2. 用 'Can you do me a favor?' 开头，练习3个不同场景的求助对话\n3. 描述你自己的完美周末（至少5句话，用 first... second... 结构）\n4. 思考并写下：What do you think of successful life?（至少5句话，要有具体条件）\n5. 坚持背单词：每天5个新词 + 复习旧词" },

      { h:"复习：点咖啡对话", type:"dialog", lines:[["Lucy","Can I get a cup of latte?"],["Lucy","Can I get the menu? Do you have some recommendation?"],["Lucy","Can I get a large size coffee?"],["Lucy","Would you like some sugar?"],["Lucy","For here or take away?"],["Lucy","Can I pay by card?"],["Lucy","Can I get the bill, please?"]] },
      { h:"复习：酒店入住对话", type:"dialog", lines:[["Lucy","I have a reservation. We are under one name."],["Lucy","Please show your passport."],["Lucy","Here is your key card."],["Lucy","One double room for two days. Is breakfast included?"],["Lucy","What time is check out?"],["Lucy","Can I have a wake-up call at 7 a.m.?"],["Lucy","Room 305 on the floor three."]] },
      { h:"公司介绍完整版", type:"list", items:["<span class='en'>We can do interior design for dance studio.</span>","<span class='en'>We have served overseas clients.</span>","<span class='en'>We have eight years design experience, but we never use fixed templates to create plans.</span>","<span class='en'>We understand dancers' special needs like floor, space, voice and lights.</span>","<span class='en'>So many dancers believe us.</span>","<span class='en'>Our plan not only can be safe and functional, but also have amazing visual.</span>","<span class='en'>The clients who choose us can get a complete one-stop design solution.</span>","<span class='en'>If you cooperate with us, you can get a full-process design service.</span>"] },
      { h:"Not only...but also 造句强化", type:"list", items:["<span class='en'>Our design not only can be safe, but also have amazing visual.</span>","<span class='en'>We not only provide space designing, but also apply professional advice about dance floor.</span>","<span class='en'>Our team not only can do 2D drawings, but also can create 3D renderings for you.</span>","<span class='en'>The dance studio we create not only is functional, but also is good for taking photos.</span>","<span class='en'>We not only respect your budget, but also value dancers' user experience.</span>"] },
      { h:"演讲 A：描述假期（扬州）", type:"list", items:["<b>开头</b>：<span class='en'>I'd like to talk about my last holiday.</span>","<b>行程</b>：<span class='en'>I went to Yangzhou with my husband by car for seven days.</span>","<b>体验1·扬州炒饭</b>：<span class='en'>Do you know Yangzhou fried rice is very famous in China? But when I tried it, I was so disappointed because the smell was not good.</span>","<b>体验2·搓背</b>：<span class='en'>After that, I tried another local custom — Yangzhou back massage. It is not only comfortable, but also made me relaxed and happy.</span>","<b>城市特点</b>：<span class='en'>Yangzhou is a second-tier city. It has different culture, especially in garden design. It's very elegant and amazing.</span>","<b>对比</b>：<span class='en'>Comparing with first-tier cities like Shanghai and Beijing, Yangzhou is a very relaxed city.</span>","<b>结尾</b>：<span class='en'>So I really want to recommend this city to you.</span>"] },
      { h:"演讲 B：介绍家乡（邢台）", type:"list", items:["<b>开头</b>：<span class='en'>I'd like to talk about my hometown.</span>","<b>基本信息</b>：<span class='en'>My hometown is Xingtai City. It has a long history and with little space. It has many delicious food with typical northern characteristics.</span>","<b>离开家乡</b>：<span class='en'>But I left my hometown when I went to university. So I feel stranger about my hometown when I grow up.</span>","<b>现在城市</b>：<span class='en'>Now I have adapted Beijing that has fast pace.</span>","<b>转折</b>：<span class='en'>But I still think my hometown has warm atmosphere for me.</span>","<b>建议</b>：<span class='en'>So if you decide to stay in a first-tier city when you graduate, it's a very good decision.</span>","<b>上高度</b>：<span class='en'>And our aim is to contribute our hometown using work experience.</span>"] },
      { h:"演讲技巧 Tips", type:"list", items:["<b>框架感</b>：开头 → 经历/事实 → 转折/对比 → 感受 → 结尾推荐/上高度","<b>用问句</b>：<span class='en'>Do you know...?</span> 增加互动感","<b>用连接词</b>：but, so, not only...but also, after that, comparing with","<b>描述时间</b>：since, after, before 让叙述更有前后顺序","<b>不知道怎么说时</b>：想简单表达，判断好/坏事 → good for / bad for","<b>结尾上高度</b>：用第二/三人称（if you...）让观点更客观、更有价值感"] },

  {
    id: 4,
    date: "2026-10-11",
    title: "第四课：场景实战——点咖啡、酒店入住、介绍公司",
    subtitle: "Mike 老师 · 课前小测 · 两大生活场景对话 · 公司团队介绍 · 1分钟演讲起步",
    tags: ["场景对话", "点咖啡", "酒店入住", "公司介绍", "小测"],
    sections: [
    { h:"一、热身闲聊：扬州之旅", type:"list", items:["自驾去扬州（Jiangsu Province），单程约 <span class='b'>12 小时</span>（含堵车 traffic jam）。","「我好累、有点困」→ <span class='en'>I feel a little tired and sleepy.</span>（sleepy = 困，sleep = 睡觉）","扬州特色搓背文化（back massage）：先泡澡，专业师傅用毛巾搓背。<span class='b'>湿搓 wet</span>（扬州）vs <span class='b'>干搓 dry</span>（内蒙古试过）。第一次体验：pretty awesome!","扬州炒饭（Yangzhou fried rice）吐槽：米饭很硬、贵、没达到预期 → <span class='en'>It's good, but not so good.</span> 而且是预制菜（<span class='b'>pre-made meals</span>）。","工作：新项目<strong>将要开始</strong> → <span class='en'>The next project is about to begin.</span>（be about to = 将要、马上）目前在设计阶段，昨天和设计師、施工方（builder）去了项目现场（project site / location）。","晚上汇报了新店（new store）的平面图 → <span class='b'>layout drawing</span>（平面图最准确的说法）。"] },
    { h:"二、课前小测（你答对了多少？）", type:"list", items:["<strong>改错</strong>：<span class='no'>What do you do（假期中）</span> → <span class='ok'>What did you do?</span> <span class='why'>did 已表过去，后面动词用原形。</span>","<span class='no'>Can you plays the guitar?</span> → <span class='ok'>Can you play…?</span> <span class='why'>主语是 you，动词不加 s。</span>","<span class='no'>Where is she go?</span> → <span class='ok'>Where is she going?</span> <span class='why'>现在进行时：be + going。</span>","<span class='no'>He like many food.</span> → <span class='ok'>He likes…</span> <span class='why'>三单加 s。</span>","<span class='no'>How long you stay at home?</span> → <span class='ok'>How long did you stay at home?</span> <span class='why'>要加助动词 did，stay 用原形。</span>","<strong>选词填空</strong>：车站有多远 → <span class='en'>How far is the station?</span>｜你有多少本书 → <span class='en'>How many books do you have?</span>｜你会在中国待多久 → <span class='en'>How long will you stay in China?</span>｜多久锻炼一次 → <span class='en'>How often do you exercise?</span>","<strong>连词成句</strong>：<span class='en'>What did you do during the holiday? / How many photos did you take during the holiday? / Did you stay at home or go traveling? / How was your holiday trip?</span>","<span class='b'>business trip</span> = 出差（holiday trip 是度假旅行，别搞混）。"] },
    { h:"三、场景一：点咖啡 ☕ 词汇与句型", type:"list", items:["饮品：<span class='en'>espresso</span> 浓缩 / <span class='en'>americano</span> 美式 / <span class='en'>latte</span> 拿铁 / <span class='en'>cappuccino</span> 卡布奇诺 / <span class='en'>mocha</span> 摩卡 / <span class='en'>matcha</span> 抹茶；<span class='en'>menu</span> 菜单 / <span class='en'>size</span> 尺寸 / <span class='en'>sugar</span> 糖 / <span class='en'>bill</span> 账单。","「我要一杯拿铁」→ <span class='en'>I want to get a cup of latte.</span>（要带上 get / have，不要只说 I want）","「请给我菜单」→ <span class='no'>✗ Please give me the menu.</span> <span class='ok'>✓ Can I have the menu, please?</span> <span class='why'>give me 太直接，老外习惯用 Can I have/get… 委婉表达。</span>","「你们有什么推荐？」→ <span class='en'>What do you recommend?</span>（动词）/ <span class='en'>Do you have any recommendations?</span>（名词，注意加 s）","大杯 = <span class='b'>large size</span>，中杯 = <span class='b'>middle size</span>。","「要加糖吗」→ <span class='en'>Would you like some sugar?</span>｜糖度：三分糖 = 30% sugar，五分糖 = <span class='b'>half sugar</span>。","「在这吃还是打包」→ <span class='en'>For here or to take away?</span>（ to go 也对；几个词就能表达，不用造完整句）","「可以刷卡吗」→ <span class='en'>Can I pay by card?</span>（pay by 支付宝 Alipay / WeChat / cash 现金）｜「请给我账单」→ <span class='en'>Can I get the bill, please?</span>"] },
    { h:"场景一：模拟对话（咖啡店）", type:"dialog", lines:[["Mike","Hello miss, how many people?"],["Lucy","Only one. Can I get the menu?"],["Mike","Sure. What would you like to drink?"],["Lucy","Do you have any recommendation?"],["Mike","Yes, our latte is so popular. Would you like to try?"],["Lucy","I want to get a middle size latte."],["Mike","Would you like some sugar?"],["Lucy","No thank you. Can I get a cup of water?"],["Mike","Anything else?"],["Lucy","Nothing. That's all."],["Mike","For here or to go?"],["Lucy","For here. Can I pay by card?"],["Mike","Sure. That's 25 yuan."],["Lucy","Thank you. Here you are."]] },
    { h:"四、场景二：酒店入住 🏨 词汇与句型", type:"list", items:["<span class='en'>reception</span> 前台｜<span class='en'>reservation</span> 预订（名词）｜<span class='en'>passport</span> 护照｜<span class='en'>key card</span> 房卡｜<span class='en'>check in / check out</span> 入住 / 退房｜<span class='en'>wake up call</span> 叫醒服务｜<span class='en'>double room</span> 大床房｜<span class='en'>twin room</span> 双床房｜<span class='en'>fill in</span> 填写。","「我有预订」→ <span class='en'>I have a reservation.</span>（酒店、餐厅、电影院通用！）","「办理入住」→ <span class='en'>I want to check in.</span>｜「我用王的名字订的房」→ <span class='en'>I have a reservation under Wang's name.</span>（under the name of… 用…的名字）","「一间大床房住两晚」→ <span class='en'>One double room for two nights.</span>（for + 时间段）","「含早餐吗」→ <span class='no'>✗ Do you include breakfast?</span> <span class='ok'>✓ Is breakfast included?</span> <span class='why'>早餐是物品不能自己“包含”，要用被动语态 is included。</span>","「几点退房」→ <span class='en'>What time is check out?</span>（把中文语序换成“退房是几点”就通了）","「能 7 点叫醒我吗」→ <span class='en'>Can I have a wake up call at seven a.m.?</span>","「这是你的房卡，305 房间，3 楼」→ <span class='en'>Here's your key card. Room 305 on the floor three.</span>（老外先说 room 再说号码；here you are = 给你）"] },
    { h:"场景二：模拟对话（酒店前台）", type:"dialog", lines:[["Mike","Hello Lucy, what can I do for you?"],["Lucy","I want to check in."],["Mike","Do you have a reservation?"],["Lucy","Yes, I have a reservation under Wang's name."],["Mike","Can I have your passport?"],["Lucy","OK, here you are."],["Mike","How many nights do you want to stay?"],["Lucy","Two nights. Is breakfast included?"],["Mike","Yes, we provide the breakfast, from seven a.m. to ten a.m."],["Lucy","Can I have a wake up call at seven a.m.?"],["Mike","Sure. Your room is 305 on the floor three. Here's your key card."],["Lucy","Thank you. What time is check out?"],["Mike","Just before twelve a.m. Have a good day!"]] },
    { h:"五、场景三：介绍公司团队（整段输出）", type:"list", items:["分块练习，一块一块说，别盯着中文逐字翻——先想“英语先说谁”。","<div class='bbox en'>We can do the interior design projects for dance studios, and we have served many overseas dancers. We have eight years' experience, but we never use fixed templates to create the same plan. We always listen to clients' ideas, and we understand dancers' special needs like floor, space, light and voice. So many dancers believe us.</div>","<strong>语法点</strong>：<span class='b'>现在完成时</span> we <span class='b'>have served</span>（从过去持续到现在，have + 过去分词）｜overseas 海外的（= global / international）｜<span class='en'>listen to</span> 倾听（to 不能丢）｜想法 = <span class='b'>idea</span>｜信任 = believe / trust us。"] },
    { h:"六、本课语法点小结", type:"list", items:["<span class='b'>be about to</span> = 将要、马上：<span class='en'>The project is about to begin.</span>","<span class='b'>现在完成时</span>：have / has + 动词过去分词 → <span class='en'>We have served many overseas dancers.</span>","<span class='b'>被动语态</span>：物品“被包含” → <span class='en'>Is breakfast included?</span>","<span class='b'>under the name of…</span> = 用…的名字预订。","<span class='b'>for + 时间段</span>：<span class='en'>for two nights / for two months</span>","委婉表达套路：<span class='b'>Can I have / get…?</span> 代替 Give me…（点单、酒店万能句型）。"] },
    { h:"课后作业", type:"homework", text:"① 从今天开始每天背 15 个单词（用「不背单词」APP，老师会发词表）；② 把点咖啡、酒店入住两段对话练熟，练到不看提示能说；③ 把公司介绍的整段输出背流利——10 月开始每课都有大量中译英练习，并逐步过渡到 1 分钟无中文提示的自我演讲。" },

    title: "第三课：并列句——把句子流利地连起来",
    subtitle: "Mike 老师 · 热身闲聊 · 疑问句复习 · 并列句 and/but/so",
    tags: ["并列句", "and/but/so", "设计师词汇", "整段输出"],
    sections: [
    { h:"一、热身闲聊", type:"list", items:["上周去<strong>上海出差</strong>，参加开幕式：attend the opening ceremony。","中秋节放 <span class='b'>4 天</span>假（其中 3 天要回公司上班）；国庆节 <span class='b'>National Day</span> 放 7 天，计划开车去<span class='b'>扬州</span>旅行。","假期必堵车：<span class='en'>There's always a traffic jam on the holiday.</span>","放假前上班状态：满脑子都是假期 → <span class='en'>Everything goes around the holiday.</span>"] },
    { h:"二、上节复习：三种疑问句", type:"list", items:["<strong>特殊疑问句</strong>：<span class='no'>✗ What's your feeling today?</span> → <span class='ok'>✓ How do you feel today? / What do you feel today?</span><br><span class='why'>feel 是动词，疑问句要请助动词 do 帮忙。</span>","<strong>一般疑问句</strong>：<span class='no'>✗ Do you have dinner?</span> → <span class='ok'>✓ Did you have dinner? / Have you had dinner?</span><br><span class='why'>“吃了吗”问的是过去 → did；或现在完成时 Have you had…（最地道）。</span>","<strong>情态动词</strong>：<span class='no'>✗ Shall you…?</span> → <span class='ok'>✓ Shall we begin the class today?</span><br><span class='why'>shall 只跟 I / we，没有 shall you。</span>"] },
    { h:"三、热身朗读：Percy Buttons", type:"list", items:["课文梗概：刚搬到 Bridge Street 的作者，遇到乞丐 <span class='en'>Percy Buttons</span> 敲门要饭和啤酒，作为回报他倒立唱歌，还把一块奶酪放进口袋走了。邻居说他每个月都来这条街每家每户要一次。","课堂练习：<strong>用 3 句话总结故事</strong>。前两句话交代过程，最后一句要有“总结”作用，点出故事意味。","<span class='ok'>✓ A man named Percy Buttons knocked at the door and asked for a meal and a glass of beer. It wasn't the first time — actually, he always does this once a month in the street.</span>","<span class='why'>「不是第一次」= It wasn't the first time（过去式）；口语“实际上”用 <span class='b'>actually</span>（in fact 偏书面）。</span>","<span class='why'>💡 口语逻辑：不需要高级单词，把简单句按逻辑连起来、说得流利完整，就是好的口语。</span>"] },
    { h:"四、核心语法：并列句", type:"list", items:["把简单的<strong>主谓宾 / 主系表</strong>句子用连接词串起来，就能流利描述一件事。口语流利的核心 = <span class='b'>单词量 + 会连接</span>。","<span class='b'>and</span>（然后、接着）/ <span class='b'>but</span>（但是）/ <span class='b'>so</span>（所以）。中文「然后/但是/所以」基本可以直接对应。","<div class='bbox'>主谓宾 / 主系表 <span class='b'>and</span> 主谓宾 / 主系表 <span class='b'>but</span> … <span class='b'>so</span> …</div>","<strong>节奏感</strong>：连接词反而要重读、稍作停顿，后面内容弱读连过去。前提是把单词读熟。","<div class='bbox en'>I'm currently an interior designer <span class='b'>and</span> she does dance studio store design in shopping malls. She originally worked in brand design <span class='b'>but</span> she stayed in the commercial space industry. Clients are not familiar with dance studio needs <span class='b'>so</span> she introduced the layout and lighting.</div>"] },
    { h:"五、逐句翻译精讲", type:"list", items:["① Lucy 目前是一名室内设计师。<br><span class='en'>Lucy is an interior designer <span class='b'>right now / currently</span>.</span><br><span class='why'>不会 currently 时先用 right now 顶上；副词可放句首或句中。</span>","② 她在商场做舞蹈室门店设计。<br><span class='en'>She does dance studio store design in shopping malls.（合起来：She does <span class='b'>both</span> store and brand design for dance studios in shopping malls.）</span><br><span class='why'>英语先说“做什么设计”，地点放最后；“两者都”用 both。</span>","③ 她本来做品牌设计，但留在了商业空间行业。<br><span class='en'>She originally worked in brand design, <span class='b'>but</span> she stayed in the commercial space industry.</span><br><span class='no'>✗ she do brand design</span> <span class='why'>she 是三单 → does / worked</span>","④ 客户不熟悉舞蹈室的需求，所以她会介绍布局和灯光。<br><span class='en'>Clients are not familiar <span class='b'>with</span> dance studio needs, <span class='b'>so</span> she would introduce the layout and lighting.</span><br><span class='why'>familiar 是形容词 → 用 be 动词（are not）；形容词后接名词要用介词 with；需求 = demands / requirements。</span>","⑤ 她最近参观了几家门店，尤其喜欢简洁的氛围。<br><span class='en'>She has visited several mall stores <span class='b'>recently</span>, and she especially likes a simple atmosphere.</span><br><span class='no'>✗ the atmosphere of simple</span> → <span class='ok'>a simple atmosphere</span> <span class='why'>形容词直接修饰名词，不用 of</span>","⑥ 舞蹈室需要镜子，但灯光太多会不舒服。<br><span class='en'>A dance studio needs mirrors, <span class='b'>but</span> too many lights are not comfortable.</span><br><span class='no'>✗ lights too much</span> → <span class='ok'>✓ too many lights</span> <span class='why'>形容词放名词前；lights 可数用 too many。中文和英语语序不同，翻译时要转换。</span>","⑦ 这个布局对学生很方便，她向品牌推荐这个方案。<br><span class='en'>This layout is convenient <span class='b'>for</span> students, <span class='b'>so</span> she recommends this plan <span class='b'>to</span> the brand.</span><br><span class='why'>“对……方便”用 for 表目的/对象；“向某人推荐”用 to 表方向。</span>","⑧ 她本来向往品牌方向发展，但仍留在这个行业。<br><span class='en'>She wanted to develop <span class='b'>toward</span> the brand direction, but she stayed in this industry.</span><br><span class='why'>“朝……方向”的介词是 toward；“留在行业” = stay in the industry。</span>","⑨ 设计目的是展示品牌文化，让空间有独特感。<br><span class='en'>The purpose of design is <span class='b'>to</span> display the brand culture and <span class='b'>make</span> the space unique.</span><br><span class='no'>✗ the design propose is display…</span><br><span class='why'>①「设计的目的」= the purpose <span class='b'>of</span> design；② is 和 display 两个动词会“打架”，中间加 <span class='b'>to</span> 表目的；③ 让空间独特 = make + 宾语 + 形容词（同 make you happy）。</span>","⑩ 她很珍惜这个机会，希望以后能和国外设计师交流。<br><span class='en'>She appreciates this opportunity, and she hopes she can communicate with international designers <span class='b'>in the future</span>.</span><br><span class='why'>“以后/在未来” = in the future（最常用）；chance 偏“可能性”，opportunity 才是“机会”。</span>"] },
    { h:"六、整段口语输出（跟读材料）", type:"list", items:["<div class='bbox en'>Lucy is currently an interior designer, and she does both store and brand design for dance studios in shopping malls. She originally worked in brand design — actually, she wanted to develop toward the brand direction, but she stayed in the commercial space industry. Clients are not familiar with dance studio needs, so she would introduce the layout and lighting. She has visited several mall stores recently, and she especially likes a simple atmosphere. She thinks a dance studio needs mirrors and a proper floor, but too many lights are not comfortable. The layout is convenient for students, so she recommends this plan to clients. She thinks the purpose of design is to display the brand culture and make the space unique. She appreciates this opportunity, and she hopes she can communicate with international designers in the future.</div>","<span class='why'>📌 练习方法：每天看着中文提示自己说一遍，再对照英文检查卡壳的地方。</span>"] },
    { h:"七、本课纠错 Top 清单", type:"list", items:["三单：she <span class='b'>does / works</span>（不是 do）","过去式：<span class='en'>Did you have dinner?</span>（不是 Do）","familiar 是形容词：<span class='b'>be</span> familiar <span class='b'>with</span>，不能直接接名词","「太多灯光」：<span class='b'>too many lights</span>，形容词在前","「简洁的氛围」：<span class='b'>a simple atmosphere</span>，形容词直接修饰，不用 of","两个动词打架要加 <span class='b'>to</span>：is to display / need to do / want to develop","make + 宾语 + 形容词：make the space <span class='b'>unique</span> / make you <span class='b'>happy</span>","目的/对象用 <span class='b'>for</span>，方向用 <span class='b'>to</span>：convenient for students / recommend to clients","shall 只跟 I/we：<span class='en'>Shall we begin?</span>（没有 Shall you）"] },
    { h:"八、口语金句", type:"list", items:["<span class='en'>I appreciate this opportunity.</span> —— 一个词 appreciate 秒杀 thank you","<span class='en'>Actually, he always does this.</span> —— actually = 口语“实际上”","<span class='en'>I stayed home all day.</span> —— 宅在家一整天"] },
    { h:"课后作业", type:"homework", text:"① 每天单词打卡：把本课单词本里不熟的词标记出来反复读，坚持一个月；② 把第六部分整段输出练到流利；③ 坚持复习，2 个月后看到不一样的自己。" },

    subtitle: "Mike 老师 · 课文热身 · 疑问词+助动词+主语 · how 大家族 · 场景实战",
    tags: ["特殊疑问句", "how 大家族", "连读", "场景实战"],
    sections: [
    { h:"一、热身小词汇", type:"list", items:["「差不多」= <span class='en'>almost</span>。","一整天宅在家 = <span class='en'>stay at home</span>（stay at home 就是「宅在家」的意思，中英文常常可以直接对应）。"] },
    { h:"二、热身朗读：A Private Conversation", type:"list", items:["课文梗概：作者上周去剧院看戏，座位很好、戏也很有趣，但身后一对年轻男女大声说话。作者生气地瞪他们，他们完全没注意（did not pay any attention）。最后作者忍无可忍（could not bear it），回头说「我一个字都听不见」，那男的粗鲁地回答：<span class='en'>It's none of your business. This is a private conversation.</span>","<span class='b'>It's none of your business.</span> = 不关你事。比较口语，语气重——很生气、要划清界限时才用。","<span class='en'>business</span> 这里是「事情、业务」的意思；<span class='en'>rudely</span> 粗鲁地（rude 粗鲁的 + ly）。","<span class='en'>bear</span> 作动词 = 承受。<span class='en'>I could not bear it.</span> = 我受不了了 / 忍无可忍。","关键句型：他们没有注意到我 = <span class='en'>They did not pay any attention.</span>（pay attention 注意）。"] },
    { h:"三、核心语法：特殊疑问句三步造句", type:"list", items:["<strong>第①步 疑问词永远放第一</strong>：what 什么 / where 哪里 / who 谁 / why 为什么 / which 哪一种 / how 怎样。疑问词可以是好几个词组合（如 how many books）。","<strong>第②步 助动词</strong>：句子有实义动词就用 do / does / did（时态决定：过去时用 did）；描述「是什么、怎么样」的状态用 be 动词 am / is / are。","<strong>第③步 主语 + 动词</strong>：主语永远排第三；助动词后面动词用<strong>原形</strong>（What did you <span class='b'>do</span>?）。","<span class='why'>唯一例外：be 动词后面动词加 ing → <span class='en'>What are you doing?</span>（现在进行时，表示「你正在做什么」）。</span>","<div class='bbox'>疑问词 <span class='b'>+</span> 助动词（do/does/did 或 am/is/are）<span class='b'>+</span> 主语 <span class='b'>+</span> 动词原形…？</div>","课堂实例：<span class='no'>✗ What thing do you learn from the article?</span> → <span class='ok'>✓ What did you learn from this article?</span><br><span class='why'>中文没有「东西」就不用加 thing；learn 是实义动词且是过去式 → 用 did。</span>"] },
    { h:"四、课堂造句练习", type:"list", items:["你今天做了什么？→ <span class='en'>What did you do today?</span>","哪一种音乐风格你最喜欢？→ <span class='en'>Which music style do you like the most?</span>（like the most 连读 most 别读成两个音）","你们项目负责人是谁？→ <span class='en'>Who is your project leader?</span>（project 项目 + leader 领导）","他们为什么会这样做？→ <span class='en'>Why do they do this?</span><br><span class='why'>一般现在时：描述一种习惯或现象（经常这样做），不是过去、也不是正在做，所以用 do。</span>","你昨天去哪里了？→ <span class='en'>Where did you go yesterday?</span>","你是怎么做到的？→ <span class='en'>How did you do it?</span>（「做到了」= 已经完成 → 过去式 did）"] },
    { h:"五、how 大家族（how + 形容词问一切）", type:"list", items:["<span class='b'>how many</span> + 可数名词复数（books）；<span class='b'>how much</span> + 不可数名词（water / money——money 没有复数！）","how long 多久 / how often 多久一次 / how soon 还要多久 / how far 多远 / how high 多高（山）/ how tall 多高（人）/ how deep 多深 / how fast 多快 / how old 多大 / how big 多大","<strong>how 后面可以直接加形容词</strong>：<span class='en'>How beautiful is your sister?</span>（你妹妹有多美）/ <span class='en'>How bad is your boyfriend?</span>（你男朋友有多坏）/ How spicy is it?（多辣）","课堂练习：<span class='en'>How many books do you have? / How far is the station? / How long will you stay? / How old are you? / How big is your room? / How tall is he?</span>","<span class='why'>💡 描述「是什么 / 有多远 / 有多大」这种状态的问句用 be 动词：<span class='en'>How far is the station?</span> 而不是 do。</span>"] },
    { h:"六、发音小贴士", type:"list", items:["<strong>连读</strong>：辅音 + 元音要连起来 → <span class='en'>bear it</span> 读成「bear-it」，<span class='en'>look at</span> 读成「loo-kat」。","<strong>ed 常常不发音</strong>：过去式 locked 在 <span class='en'>I looked at the man</span> 里，ed 基本不发出来；只有当这个过去式单词单独被强调时才发 ed 音。","不要太纠结传统拼读规则——口语以「顺」为目标，就像老外日常说话也不会一个字一个字拼。","<strong>音量放低一点、气息弱一点</strong>，反而说得更快更流利（Mike 的课堂提醒）。","注意 where /weə/ 的发音，别读成 well /wel/（课堂专门纠正过哦）。"] },
    { h:"七、场景实战：问外国朋友四个问题", type:"list", items:["你想去哪里（玩）？→ <span class='en'>Where do you want to go?</span>","你想吃什么？→ <span class='en'>What food do you want (to eat)?</span>","你想什么时候起床出去玩？→ <span class='en'>When do you want to get up to play?</span>（get up 起床；wake up 只是醒来）","你觉得这个城市怎么样？→ <span class='en'>How do you think of this city?</span>"] },
    { h:"课堂模拟对话", type:"dialog", lines:[["Lucy","How do you think of this city?"],["Mike","Well, I live in Shenzhen. I think it's a very beautiful and also very technology city. I really like this city atmosphere."],["Lucy","When do you want to get up to play?"],["Mike","Usually I will get up at six o'clock, but right now I want to get up at five a.m. because I want to see the sunrise."],["Lucy","Where do you want to go?"],["Mike","I want to go to the park — Talent Park."],["Lucy","What kind of food do you like?"],["Mike","Well, I like spicy food, you know."]] },
    { h:"八、本课纠错 Top 清单", type:"list", items:["特殊疑问句不要加 thing：<span class='no'>✗ What thing…</span> → <span class='ok'>✓ What did you learn…?</span>","时态看助动词：过去的事用 <span class='b'>did</span>，动词变回原形。","描述习惯 / 现象用一般现在时：<span class='en'>Why do they do this?</span>","状态类问句用 be 动词：<span class='en'>How far is the station?</span>","money 不可数：只能用 <span class='b'>how much</span>，没有 moneys。","起床 = <span class='b'>get up</span>；wake up 只是「醒来」。"] },

  { w:"match", p:"/mætʃ/", m:"v. 搭配", e:"They match well." },
  { w:"prefer", p:"/prɪˈfɜː/", m:"v. 更喜欢", e:"I prefer simple styles." },
  { w:"background", p:"/ˈbækɡraʊnd/", m:"n. 背景", e:"She has a design background." },
  { w:"culture", p:"/ˈkʌltʃə/", m:"n. 文化", e:"brand culture" },
  { w:"actually", p:"/ˈæktʃuəli/", m:"adv. 实际上（口语）", e:"Actually, he always does this." },
];


/* ================= 语音功能 ================= */
let VOICES = [];
function loadVoices(){
  VOICES = speechSynthesis.getVoices();
  const sel = document.getElementById("voiceSel");
  sel.innerHTML = "";
  const en = VOICES.filter(v=>/en(-|_)/i.test(v.lang));
  en.forEach((v,i)=>{
    const o = document.createElement("option");
    o.value = VOICES.indexOf(v);
    const female = /female|woman|zira|samantha|karen|moira|tessa|susan|hazel|google uk english female/i.test(v.name);
    o.textContent = (female?"💃 ":"") + v.name + " (" + v.lang + ")";
    sel.appendChild(o);
    if(female && !sel.dataset.picked){ sel.value = o.value; sel.dataset.picked = "1"; }
  });
  if(!en.length) sel.innerHTML = "<option value=''>本设备暂无英文声音</option>";
}
if("speechSynthesis" in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice(){
  const i = +document.getElementById("voiceSel").value;
  return VOICES[i] || null;
}
function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  const v = pickVoice(); if(v) u.voice = v;
  u.rate = parseFloat(document.getElementById("rateRange").value);
  speechSynthesis.speak(u);
}
document.getElementById("rateRange").addEventListener("input", e=>{
  document.getElementById("rateVal").textContent = e.target.value;
});

/* ================= 页面渲染 ================= */
const app = document.getElementById("app");

function speakBtn(text){
  return `<button class="speak" onclick="speak(this.dataset.t)" data-t="${text.replace(/"/g,"&quot;")}" title="朗读">🔊</button>`;
}

function renderHome(){
  document.querySelector('[data-nav="home"]').classList.add("on");
  const sorted = [...LESSONS].sort((a,b)=>b.id-a.id);
  const done = LESSONS.filter(l=>l.tags[0]!=="待更新").length;
  app.innerHTML = `
    <div class="hero">
      <div class="hello">EVERYDAY ENGLISH</div>
      <h1>Lucy 的英语复习站</h1>
      <p>每节课的笔记都整理在这里，点 🔊 随时跟读。</p>
      <div class="chips">
        <div class="chip">已更新 <b>${done}</b> 节课</div>
        <div class="chip">坚持复习</div>
        <div class="chip"><b>2 个月后</b>看到不一样的自己 ✨</div>
      </div>
    </div>
    <div class="lesson-grid">
      ${sorted.map(l=>`
        <a class="lesson-card ${l.tags[0]==="待更新"?"soon":""}" href="#/lesson/${l.id}">
          <div class="top-row"><span class="no">第 ${l.id} 课</span><span class="date">${l.date}</span></div>
          <h2>${l.title}</h2>
          <div class="sub">${l.subtitle}</div>
          <div class="tags">${l.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
        </a>`).join("")}
    </div>`;
}

function renderLesson(id){
  const l = LESSONS.find(x=>x.id===id);
  if(!l){ location.hash = "#/"; return; }
  const sorted = [...LESSONS].sort((a,b)=>a.id-b.id);
  const idx = sorted.findIndex(x=>x.id===id);
  const prev = sorted[idx-1], next = sorted[idx+1];
  app.innerHTML = `
    <div class="lesson-head">
      <div class="crumb"><a href="#/">首页</a> / 第 ${l.id} 课</div>
      <h1>${l.title}</h1>
      <div class="meta">${l.date} · ${l.subtitle}</div>
      <div class="tags">${l.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
    </div>
    ${l.audio?`<div class="hw" style="margin-top:14px;">🎧 本课录音：<audio controls src="${l.audio}" style="width:100%;margin-top:6px;"></audio></div>`:""}
    ${l.sections.map(sec=>{
      let body="";
      if(sec.type==="list"){
        body = "<ul>" + sec.items.map(it=>{
          const m = it.match(/<span class='en'>([\s\S]*?)<\/span>/);
          return `<li>${it}${m?speakBtn(m[1]):""}</li>`;
        }).join("") + "</ul>";
      }else if(sec.type==="dialog"){
        body = `<div class="dialog">` + sec.lines.map(([who,text])=>`
          <div class="line ${who==="Lucy"?"lucy":"mike"}">
            <span class="who">${who}</span>
            <span class="msg en">${text}${speakBtn(text)}</span>
          </div>`).join("") + "</div>";
      }else if(sec.type==="homework"){
        body = `<div class="hw">📝 ${sec.text}</div>`;
      }else{
        body = `<p>${sec.text||""}</p>`;
      }
      return `<section class="sec"><h2>${sec.h}</h2>${body}</section>`;
    }).join("")}
    <div class="pager">
      ${prev?`<a href="#/lesson/${prev.id}">← 上一课<small>第 ${prev.id} 课</small></a>`:`<a href="#/">← 返回首页</a>`}
      <a href="#/">课程总览<small>所有课时</small></a>
      ${next?`<a href="#/lesson/${next.id}">下一课 →<small>第 ${next.id} 课</small></a>`:`<a href="#/">回到首页 →</a>`}
    </div>`;
  window.scrollTo(0,0);
}

function renderWords(){
  document.querySelector('[data-nav="words"]').classList.add("on");
  app.innerHTML = `
    <div class="lesson-head">
      <div class="crumb"><a href="#/">首页</a> / 单词本</div>
      <h1>单词本 <small style="font-size:13px;color:var(--muted);font-weight:400;">（点击卡片朗读 · 共 ${WORDS.length} 词）</small></h1>
    </div>
    <div class="word-grid">
      ${WORDS.map(w=>`
        <div class="word-card" onclick="speak('${w.w}')">
          <div class="w">${w.w} ${speakBtn(w.w)}</div>
          <div class="p">${w.p}</div>
          <div class="m">${w.m}</div>
          <div class="e">${w.e}</div>
        </div>`).join("")}
    </div>`;
}

/* ================= 路由 ================= */
function route(){
  document.querySelectorAll("[data-nav]").forEach(a=>a.classList.remove("on"));
  const h = location.hash || "#/";
  const m = h.match(/^#\/lesson\/(\d+)/);
  if(m){ renderLesson(+m[1]); }
  else if(h==="#/words"){ renderWords(); }
  else{ renderHome(); }
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
