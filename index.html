<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucy 的英语复习站</title>
<style>
/* ================= 基础 ================= */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#FFF9F2;
  --card:#FFFFFF;
  --ink:#33302B;
  --muted:#9A9186;
  --accent:#FF6B4A;
  --accent-soft:#FFE9E2;
  --green:#2E9E6B;
  --green-soft:#E3F4EC;
  --blue:#3E6FB0;
  --blue-soft:#E7EEF8;
  --line:#F2E8DA;
  --radius:16px;
  --shadow:0 2px 10px rgba(51,48,43,.05);
}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.8;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:820px;margin:0 auto;padding:0 18px;}
.en{font-family:Georgia,"Times New Roman",serif;}

/* ================= 顶部 ================= */
header.top{
  background:var(--card);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:100;
}
header.top .wrap{height:58px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:17px;font-weight:800;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px;}
.logo::before{content:"📖";font-size:18px;}
nav.tabs{display:flex;gap:6px;}
nav.tabs a{
  text-decoration:none;color:var(--muted);font-size:14px;padding:6px 14px;border-radius:999px;
}
nav.tabs a.on,nav.tabs a:hover{background:var(--accent-soft);color:var(--accent);}

/* ================= 声音设置 ================= */
.voice-panel{
  background:linear-gradient(135deg,#FFF1E8,#FFE7DC);
  border:1px solid #FFD9C8;border-radius:var(--radius);
  padding:14px 18px;margin:18px 0 0;
}
.voice-panel summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px;}
.voice-panel summary::before{content:"🔊";}
.voice-panel summary::-webkit-details-marker{display:none;}
.voice-panel .row{margin-top:10px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.voice-panel select{
  font-size:13px;padding:6px 10px;border-radius:10px;border:1px solid #F0C9B6;background:#fff;max-width:100%;
}
.voice-panel input[type=range]{width:160px;accent-color:var(--accent);}
.voice-panel .tip{font-size:12px;color:var(--muted);margin-top:6px;}

/* ================= 首页 ================= */
.hero{padding:44px 0 10px;text-align:center;}
.hero .hello{font-size:14px;color:var(--accent);font-weight:700;letter-spacing:2px;}
.hero h1{font-size:30px;margin:6px 0 8px;}
.hero p{color:var(--muted);font-size:14px;}
.hero .chips{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
.hero .chip{
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:6px 18px;font-size:13px;color:var(--muted);box-shadow:var(--shadow);
}
.hero .chip b{color:var(--accent);}

.lesson-grid{padding:16px 0 40px;}
a.lesson-card{
  display:block;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);
  transition:transform .15s,box-shadow .15s;
}
a.lesson-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(51,48,43,.09);}
.lesson-card .top-row{display:flex;justify-content:space-between;align-items:center;}
.lesson-card .no{
  font-size:12px;font-weight:800;color:var(--accent);background:var(--accent-soft);
  border-radius:999px;padding:2px 12px;
}
.lesson-card .date{font-size:12px;color:var(--muted);}
.lesson-card h2{font-size:17px;margin:8px 0 4px;}
.lesson-card .sub{font-size:13px;color:var(--muted);}
.lesson-card .tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
.lesson-card .tag{font-size:11px;color:var(--green);background:var(--green-soft);border-radius:999px;padding:1px 9px;}
.lesson-card.soon{opacity:.55;}

/* ================= 课时页 ================= */
.lesson-head{padding:30px 0 4px;}
.lesson-head .crumb{font-size:13px;color:var(--muted);margin-bottom:8px;}
.lesson-head .crumb a{color:var(--accent);text-decoration:none;}
.lesson-head h1{font-size:24px;}
.lesson-head .meta{color:var(--muted);font-size:13px;margin-top:4px;}
.lesson-head .tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;}
.lesson-head .tag{font-size:11px;color:var(--green);background:var(--green-soft);border-radius:999px;padding:1px 9px;}

section.sec{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-top:16px;box-shadow:var(--shadow);
}
section.sec>h2{
  font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
section.sec>h2::before{
  content:"";width:5px;height:16px;border-radius:3px;background:var(--accent);flex:none;
}
section.sec ul{margin-left:20px;font-size:14.5px;}
section.sec li{margin:6px 0;}
section.sec p{font-size:14.5px;margin:6px 0;}

.speak{
  border:none;background:var(--accent-soft);color:var(--accent);cursor:pointer;
  border-radius:999px;width:26px;height:26px;font-size:13px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;margin-left:6px;vertical-align:middle;
}
.speak:hover{background:var(--accent);color:#fff;}

.ok{color:var(--green);font-weight:700;}
.no{color:#C25B4A;text-decoration:line-through;text-decoration-color:rgba(194,91,74,.4);}
.why{font-size:13px;color:var(--muted);}
.b{font-weight:700;color:var(--accent);}
.bbox{
  background:var(--blue-soft);border-radius:12px;padding:12px 16px;font-size:14.5px;
  margin:8px 0;overflow-x:auto;
}
.dialog .line{display:flex;gap:10px;margin:9px 0;font-size:14.5px;align-items:flex-start;}
.dialog .who{
  flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:2px 11px;margin-top:3px;
}
.dialog .lucy .who{background:var(--accent-soft);color:var(--accent);}
.dialog .mike .who{background:var(--blue-soft);color:var(--blue);}
.dialog .msg{flex:1;}
.hw{background:var(--green-soft);border-radius:12px;padding:12px 16px;font-size:14.5px;}

.pager{display:flex;justify-content:space-between;gap:10px;margin:26px 0 40px;flex-wrap:wrap;}
.pager a{
  flex:1;min-width:130px;text-align:center;text-decoration:none;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;
}
.pager a:hover{border-color:var(--accent);color:var(--accent);}
.pager a small{display:block;color:var(--muted);font-size:11px;}

/* ================= 单词页 ================= */
.word-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:12px;padding:16px 0 40px;
}
.word-card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;
  transition:transform .15s;
}
.word-card:hover{transform:translateY(-2px);}
.word-card .w{font-size:17px;font-weight:800;color:var(--accent);display:flex;align-items:center;}
.word-card .p{font-size:12px;color:var(--muted);font-family:Georgia,serif;}
.word-card .m{font-size:13.5px;margin-top:4px;}
.word-card .e{font-size:13px;color:var(--blue);margin-top:4px;font-family:Georgia,serif;}

/* ================= 更新说明 ================= */
.howto{
  background:#FFF4E4;border:1px dashed #F0C9A0;border-radius:var(--radius);
  padding:16px 20px;margin:10px 0 40px;font-size:13px;color:#8A6D4D;
}
.howto h3{font-size:14px;margin-bottom:6px;}
.howto code{
  display:block;background:#fff;border-radius:10px;padding:10px 12px;margin:8px 0;
  font-size:12px;overflow-x:auto;color:#6B543A;white-space:pre;
}
.howto b{color:#B0722E;}

footer{padding:22px 0;text-align:center;color:var(--muted);font-size:12px;}

@media (max-width:560px){
  .hero h1{font-size:25px;}
  .lesson-head h1{font-size:21px;}
}
</style>

<script>
/* ================================================================
   ★★★ 课程内容数据区（老师只需要改这里）★★★
   新增一节课：复制一个 LESSONS 里的模板，粘贴到
   “新课程粘贴在这一行的上方”标记处，修改 id / date / title / sections
   section 的 type 支持：
     list     → 要点列表（items 为 HTML 字符串数组，可写 <span class='en'>）
     dialog   → 对话（lines: [[说话人, 内容], ...]）
     homework → 课后作业（text 为 HTML 字符串）
     也可以直接用 note → 一段文字（text）
   想加真人录音：在课程对象里加 audio:"audio/xxx.mp3"（mp3 放仓库 audio/ 文件夹）
================================================================ */

const LESSONS = [

  /* ---------- 第 3 课（最新在上） ---------- */
  {
    id: 3,
    date: "2026-09-23",
    title: "第三课：并列句——把句子流利地连起来",
    subtitle: "Mike 老师 · 热身闲聊 · 疑问句复习 · 并列句 and/but/so",
    tags: ["并列句", "and/but/so", "设计师词汇", "整段输出"],
    sections: [
      { h: "一、热身闲聊", type: "list", items: [
        "上周去<strong>上海出差</strong>，参加开幕式：attend the opening ceremony。",
        "中秋节放 <span class='b'>4 天</span>假（其中 3 天要回公司上班）；国庆节 <span class='b'>National Day</span> 放 7 天，计划开车去<span class='b'>扬州</span>旅行。",
        "假期必堵车：<span class='en'>There's always a traffic jam on the holiday.</span>",
        "放假前上班状态：满脑子都是假期 → <span class='en'>Everything goes around the holiday.</span>",
      ]},
      { h: "二、上节复习：三种疑问句", type: "list", items: [
        "<strong>特殊疑问句</strong>：<span class='no'>✗ What's your feeling today?</span> → <span class='ok'>✓ How do you feel today? / What do you feel today?</span><br><span class='why'>feel 是动词，疑问句要请助动词 do 帮忙。</span>",
        "<strong>一般疑问句</strong>：<span class='no'>✗ Do you have dinner?</span> → <span class='ok'>✓ Did you have dinner? / Have you had dinner?</span><br><span class='why'>“吃了吗”问的是过去 → did；或现在完成时 Have you had…（最地道）。</span>",
        "<strong>情态动词</strong>：<span class='no'>✗ Shall you…?</span> → <span class='ok'>✓ Shall we begin the class today?</span><br><span class='why'>shall 只跟 I / we，没有 shall you。</span>",
      ]},
      { h: "三、热身朗读：Percy Buttons", type: "list", items: [
        "课文梗概：刚搬到 Bridge Street 的作者，遇到乞丐 <span class='en'>Percy Buttons</span> 敲门要饭和啤酒，作为回报他倒立唱歌，还把一块奶酪放进口袋走了。邻居说他每个月都来这条街每家每户要一次。",
        "课堂练习：<strong>用 3 句话总结故事</strong>。前两句话交代过程，最后一句要有“总结”作用，点出故事意味。",
        "<span class='ok'>✓ A man named Percy Buttons knocked at the door and asked for a meal and a glass of beer. It wasn't the first time — actually, he always does this once a month in the street.</span>",
        "<span class='why'>「不是第一次」= It wasn't the first time（过去式）；口语“实际上”用 <span class='b'>actually</span>（in fact 偏书面）。</span>",
        "<span class='why'>💡 口语逻辑：不需要高级单词，把简单句按逻辑连起来、说得流利完整，就是好的口语。</span>",
      ]},
      { h: "四、核心语法：并列句", type: "list", items: [
        "把简单的<strong>主谓宾 / 主系表</strong>句子用连接词串起来，就能流利描述一件事。口语流利的核心 = <span class='b'>单词量 + 会连接</span>。",
        "<span class='b'>and</span>（然后、接着）/ <span class='b'>but</span>（但是）/ <span class='b'>so</span>（所以）。中文「然后/但是/所以」基本可以直接对应。",
        "<div class='bbox'>主谓宾 / 主系表 <span class='b'>and</span> 主谓宾 / 主系表 <span class='b'>but</span> … <span class='b'>so</span> …</div>",
        "<strong>节奏感</strong>：连接词反而要重读、稍作停顿，后面内容弱读连过去。前提是把单词读熟。",
        "<div class='bbox en'>I'm currently an interior designer <span class='b'>and</span> she does dance studio store design in shopping malls. She originally worked in brand design <span class='b'>but</span> she stayed in the commercial space industry. Clients are not familiar with dance studio needs <span class='b'>so</span> she introduced the layout and lighting.</div>",
      ]},
      { h: "五、逐句翻译精讲", type: "list", items: [
        "① Lucy 目前是一名室内设计师。<br><span class='en'>Lucy is an interior designer <span class='b'>right now / currently</span>.</span><br><span class='why'>不会 currently 时先用 right now 顶上；副词可放句首或句中。</span>",
        "② 她在商场做舞蹈室门店设计。<br><span class='en'>She does dance studio store design in shopping malls.（合起来：She does <span class='b'>both</span> store and brand design for dance studios in shopping malls.）</span><br><span class='why'>英语先说“做什么设计”，地点放最后；“两者都”用 both。</span>",
        "③ 她本来做品牌设计，但留在了商业空间行业。<br><span class='en'>She originally worked in brand design, <span class='b'>but</span> she stayed in the commercial space industry.</span><br><span class='no'>✗ she do brand design</span> <span class='why'>she 是三单 → does / worked</span>",
        "④ 客户不熟悉舞蹈室的需求，所以她会介绍布局和灯光。<br><span class='en'>Clients are not familiar <span class='b'>with</span> dance studio needs, <span class='b'>so</span> she would introduce the layout and lighting.</span><br><span class='why'>familiar 是形容词 → 用 be 动词（are not）；形容词后接名词要用介词 with；需求 = demands / requirements。</span>",
        "⑤ 她最近参观了几家门店，尤其喜欢简洁的氛围。<br><span class='en'>She has visited several mall stores <span class='b'>recently</span>, and she especially likes a simple atmosphere.</span><br><span class='no'>✗ the atmosphere of simple</span> → <span class='ok'>a simple atmosphere</span> <span class='why'>形容词直接修饰名词，不用 of</span>",
        "⑥ 舞蹈室需要镜子，但灯光太多会不舒服。<br><span class='en'>A dance studio needs mirrors, <span class='b'>but</span> too many lights are not comfortable.</span><br><span class='no'>✗ lights too much</span> → <span class='ok'>✓ too many lights</span> <span class='why'>形容词放名词前；lights 可数用 too many。中文和英语语序不同，翻译时要转换。</span>",
        "⑦ 这个布局对学生很方便，她向品牌推荐这个方案。<br><span class='en'>This layout is convenient <span class='b'>for</span> students, <span class='b'>so</span> she recommends this plan <span class='b'>to</span> the brand.</span><br><span class='why'>“对……方便”用 for 表目的/对象；“向某人推荐”用 to 表方向。</span>",
        "⑧ 她本来向往品牌方向发展，但仍留在这个行业。<br><span class='en'>She wanted to develop <span class='b'>toward</span> the brand direction, but she stayed in this industry.</span><br><span class='why'>“朝……方向”的介词是 toward；“留在行业” = stay in the industry。</span>",
        "⑨ 设计目的是展示品牌文化，让空间有独特感。<br><span class='en'>The purpose of design is <span class='b'>to</span> display the brand culture and <span class='b'>make</span> the space unique.</span><br><span class='no'>✗ the design propose is display…</span><br><span class='why'>①「设计的目的」= the purpose <span class='b'>of</span> design；② is 和 display 两个动词会“打架”，中间加 <span class='b'>to</span> 表目的；③ 让空间独特 = make + 宾语 + 形容词（同 make you happy）。</span>",
        "⑩ 她很珍惜这个机会，希望以后能和国外设计师交流。<br><span class='en'>She appreciates this opportunity, and she hopes she can communicate with international designers <span class='b'>in the future</span>.</span><br><span class='why'>“以后/在未来” = in the future（最常用）；chance 偏“可能性”，opportunity 才是“机会”。</span>",
      ]},
      { h: "六、整段口语输出（跟读材料）", type: "list", items: [
        "<div class='bbox en'>Lucy is currently an interior designer, and she does both store and brand design for dance studios in shopping malls. She originally worked in brand design — actually, she wanted to develop toward the brand direction, but she stayed in the commercial space industry. Clients are not familiar with dance studio needs, so she would introduce the layout and lighting. She has visited several mall stores recently, and she especially likes a simple atmosphere. She thinks a dance studio needs mirrors and a proper floor, but too many lights are not comfortable. The layout is convenient for students, so she recommends this plan to clients. She thinks the purpose of design is to display the brand culture and make the space unique. She appreciates this opportunity, and she hopes she can communicate with international designers in the future.</div>",
        "<span class='why'>📌 练习方法：每天看着中文提示自己说一遍，再对照英文检查卡壳的地方。</span>",
      ]},
      { h: "七、本课纠错 Top 清单", type: "list", items: [
        "三单：she <span class='b'>does / works</span>（不是 do）",
        "过去式：<span class='en'>Did you have dinner?</span>（不是 Do）",
        "familiar 是形容词：<span class='b'>be</span> familiar <span class='b'>with</span>，不能直接接名词",
        "「太多灯光」：<span class='b'>too many lights</span>，形容词在前",
        "「简洁的氛围」：<span class='b'>a simple atmosphere</span>，形容词直接修饰，不用 of",
        "两个动词打架要加 <span class='b'>to</span>：is to display / need to do / want to develop",
        "make + 宾语 + 形容词：make the space <span class='b'>unique</span> / make you <span class='b'>happy</span>",
        "目的/对象用 <span class='b'>for</span>，方向用 <span class='b'>to</span>：convenient for students / recommend to clients",
        "shall 只跟 I/we：<span class='en'>Shall we begin?</span>（没有 Shall you）",
      ]},
      { h: "八、口语金句", type: "list", items: [
        "<span class='en'>I appreciate this opportunity.</span> —— 一个词 appreciate 秒杀 thank you",
        "<span class='en'>Actually, he always does this.</span> —— actually = 口语“实际上”",
        "<span class='en'>I stayed home all day.</span> —— 宅在家一整天",
      ]},
      { h: "课后作业", type: "homework", text: "① 每天单词打卡：把本课单词本里不熟的词标记出来反复读，坚持一个月；② 把第六部分整段输出练到流利；③ 坚持复习，2 个月后看到不一样的自己。" },
    ],
  },

    /* ---------- 第 2 课 ---------- */
  {
    id: 2,
    date: "2026-09-21",
    title: "第二课：特殊疑问句——三步造出任何问句",
    subtitle: "Mike 老师 · 课文热身 · 疑问词+助动词+主语 · how 大家族 · 场景实战",
    tags: ["特殊疑问句", "how 大家族", "连读", "场景实战"],
    sections: [
      { h: "一、热身小词汇", type: "list", items: [
        "「差不多」= <span class='en'>almost</span>。",
        "一整天宅在家 = <span class='en'>stay at home</span>（stay at home 就是「宅在家」的意思，中英文常常可以直接对应）。",
      ]},

/* ================= 语音功能 ================= */
let VOICES = [];
function loadVoices(){
  VOICES = speechSynthesis.getVoices();
  const sel = document.getElementById("voiceSel");
  sel.innerHTML = "";
  const en = VOICES.filter(v=>/en(-|_)/i.test(v.lang));
  en.forEach((v,i)=>{
    const o = document.createElement("option");
    o.value = VOICES.indexOf(v);
    const female = /female|woman|zira|samantha|karen|moira|tessa|susan|hazel|google uk english female/i.test(v.name);
    o.textContent = (female?"💃 ":"") + v.name + " (" + v.lang + ")";
    sel.appendChild(o);
    if(female && !sel.dataset.picked){ sel.value = o.value; sel.dataset.picked = "1"; }
  });
  if(!en.length) sel.innerHTML = "<option value=''>本设备暂无英文声音</option>";
}
if("speechSynthesis" in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice(){
  const i = +document.getElementById("voiceSel").value;
  return VOICES[i] || null;
}
function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/<[^>]*>/g,""));
  u.lang = "en-US";
  const v = pickVoice(); if(v) u.voice = v;
  u.rate = parseFloat(document.getElementById("rateRange").value);
  speechSynthesis.speak(u);
}
document.getElementById("rateRange").addEventListener("input", e=>{
  document.getElementById("rateVal").textContent = e.target.value;
});

/* ================= 路由 ================= */
function route(){
  document.querySelectorAll("[data-nav]").forEach(a=>a.classList.remove("on"));
  const h = location.hash || "#/";
  const m = h.match(/^#\/lesson\/(\d+)/);
  if(m){ renderLesson(+m[1]); }
  else if(h==="#/words"){ renderWords(); }
  else{ renderHome(); }
}
window.addEventListener("hashchange", route);
route();
